<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Time System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#171b20;
    --bg-2:#1d2329;
    --bg-3:#262d34;
    --line:#383f47;
    --amber:#e8a33d;
    --amber-dim:rgba(232,163,61,0.28);
    --teal:#5c8b89;
    --text:#ece8df;
    --text-muted:#828b93;
    --text-faint:#565e66;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% 20%, var(--bg-2) 0%, var(--bg-1) 70%);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .instrument{
    width:100%;
    max-width:460px;
    background:linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 100%);
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px 28px 24px;
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.04);
    position:relative;
  }

  .eyebrow{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:4px;
  }

  .eyebrow .name{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--teal);
  }

  .eyebrow .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--text-faint);
    border:1px solid var(--line);
    border-radius:4px;
    padding:2px 6px;
  }

  .subtitle{
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:0.04em;
    margin:0 0 22px;
  }

  .plate{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    font-weight:500;
    letter-spacing:0.28em;
    color:var(--text);
    margin-bottom:6px;
  }

  hr.rule{
    border:none;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
    margin:0 0 20px;
  }

  .dial-wrap{
    position:relative;
    width:100%;
    max-width:280px;
    margin:0 auto;
  }

  svg.dial{ width:100%; height:auto; display:block; }

  .tick-major text{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    fill:var(--text-faint);
  }

  .dial-center{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    width:70%;
  }

  .readout{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:clamp(26px, 7vw, 34px);
    color:var(--amber);
    letter-spacing:0.02em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 18px var(--amber-dim);
  }

  .readout-label{
    margin-top:6px;
    font-size:9.5px;
    letter-spacing:0.1em;
    color:var(--text-muted);
    cursor:pointer;
    user-select:none;
    border-bottom:1px dashed var(--text-faint);
    display:inline-block;
    padding-bottom:2px;
  }
  .readout-label:hover{ color:var(--teal); border-color:var(--teal); }

  .stats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:22px;
  }

  .stat{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 8px;
    text-align:center;
  }

  .stat .val{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:16px;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }

  .stat .lbl{
    margin-top:3px;
    font-size:8.5px;
    letter-spacing:0.08em;
    color:var(--text-faint);
  }

  .footer{
    margin-top:20px;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    color:var(--text-faint);
  }

  @media (prefers-reduced-motion: reduce){
    * { transition:none !important; }
  }

  .needle-tip{
    transition:cx .3s linear, cy .3s linear;
  }
  @media (prefers-reduced-motion: reduce){
    .needle-tip{ transition:none; }
  }
</style>
</head>
<body>

<div class="instrument">
  <div class="eyebrow">
    <span class="name">New Time System</span>
    <span class="badge">N.S.T.</span>
  </div>
  <p class="subtitle">Orientamento per anno, mese e ora del mese — nessun giorno.</p>

  <div class="plate" id="plate">2026 — AGOSTO</div>
  <hr class="rule">

  <div class="dial-wrap">
    <svg class="dial" viewBox="0 0 240 240">
      <circle cx="120" cy="120" r="100" fill="none" stroke="var(--bg-1)" stroke-width="12"/>
      <circle cx="120" cy="120" r="100" fill="none" stroke="var(--line)" stroke-width="1"/>
      <circle id="arc" cx="120" cy="120" r="100" fill="none" stroke="var(--amber)"
              stroke-width="12" stroke-linecap="round"
              pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100"
              transform="rotate(-90 120 120)"/>
      <g id="ticks"></g>
      <line id="needle" x1="120" y1="120" x2="120" y2="28" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="120" cy="120" r="4" fill="var(--teal)"/>
    </svg>
    <div class="dial-center">
      <div class="readout" id="readout">000:00:00</div>
      <div class="readout-label" id="readoutLabel">ore trascorse · tocca</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="val" id="statPct">0.0%</div>
      <div class="lbl">COMPLETAMENTO</div>
    </div>
    <div class="stat">
      <div class="val" id="statTotal">744h</div>
      <div class="lbl">ORE TOTALI MESE</div>
    </div>
    <div class="stat">
      <div class="val" id="statRemain">744h</div>
      <div class="lbl">ORE RIMANENTI</div>
    </div>
  </div>

  <div class="footer">
    <span>rif. calendario</span>
    <span id="calRef">—</span>
  </div>
</div>

<script>
const MONTHS = ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];

const plateEl = document.getElementById('plate');
const readoutEl = document.getElementById('readout');
const readoutLabelEl = document.getElementById('readoutLabel');
const arcEl = document.getElementById('arc');
const needleEl = document.getElementById('needle');
const ticksEl = document.getElementById('ticks');
const statPct = document.getElementById('statPct');
const statTotal = document.getElementById('statTotal');
const statRemain = document.getElementById('statRemain');
const calRef = document.getElementById('calRef');

let mode = 'elapsed'; // or 'remaining'
let lastHoursInMonth = null;

readoutLabelEl.addEventListener('click', () => {
  mode = mode === 'elapsed' ? 'remaining' : 'elapsed';
  tick();
});

function pad(n){ return String(n).padStart(2,'0'); }

function polar(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180 + Math.PI/2; // 0deg = top, clockwise
  const rad = angleDeg * Math.PI / 180;
  return {
    x: cx + r * Math.sin(rad),
    y: cy - r * Math.cos(rad)
  };
}

function buildTicks(hoursInMonth){
  ticksEl.innerHTML = '';
  const cx = 120, cy = 120;
  for(let i=0;i<20;i++){
    const angle = i/20*360;
    const isMajor = i % 5 === 0;
    const rOuter = 100;
    const rInner = isMajor ? 84 : 92;
    const p1 = polar(cx, cy, rOuter+7, angle);
    const p2 = polar(cx, cy, rInner+7, angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
    line.setAttribute('stroke', isMajor ? 'var(--text-muted)' : 'var(--line)');
    line.setAttribute('stroke-width', isMajor ? '1.5' : '1');
    ticksEl.appendChild(line);

    if(isMajor && angle < 359){
      const labelPos = polar(cx, cy, 68, angle);
      const hourVal = Math.round(hoursInMonth * (i/20));
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', labelPos.x);
      text.setAttribute('y', labelPos.y);
      text.setAttribute('text-anchor','middle');
      text.setAttribute('dominant-baseline','middle');
      text.setAttribute('class','tick-major');
      text.textContent = hourVal + 'h';
      ticksEl.appendChild(text);
    }
  }
}

function tick(){
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const startOfMonth = new Date(year, month, 1, 0,0,0,0);
  const nextMonth = new Date(year, month+1, 1, 0,0,0,0);
  const hoursInMonth = Math.round((nextMonth - startOfMonth) / 3600000);

  if(hoursInMonth !== lastHoursInMonth){
    buildTicks(hoursInMonth);
    lastHoursInMonth = hoursInMonth;
  }

  const elapsedMs = now - startOfMonth;
  const elapsedHoursExact = elapsedMs / 3600000;
  const H = Math.floor(elapsedHoursExact);
  const remMs = elapsedMs - H*3600000;
  const M = Math.floor(remMs / 60000);
  const S = Math.floor((remMs - M*60000) / 1000);

  const percent = Math.min(100, elapsedHoursExact / hoursInMonth * 100);
  const remainingHoursExact = hoursInMonth - elapsedHoursExact;
  const remH = Math.floor(remainingHoursExact);
  const remRemMs = (hoursInMonth*3600000 - elapsedMs) - remH*3600000;
  const remM = Math.floor(remRemMs / 60000);
  const remS = Math.floor((remRemMs - remM*60000) / 1000);

  plateEl.textContent = `${year} — ${MONTHS[month]}`;

  if(mode === 'elapsed'){
    readoutEl.textContent = `${String(H).padStart(3,'0')}:${pad(M)}:${pad(S)}`;
    readoutLabelEl.textContent = 'ore trascorse · tocca';
  } else {
    readoutEl.textContent = `${String(remH).padStart(3,'0')}:${pad(remM)}:${pad(remS)}`;
    readoutLabelEl.textContent = 'ore rimanenti · tocca';
  }

  arcEl.setAttribute('stroke-dashoffset', String(100 - percent));

  const needleTip = polar(120, 120, 92, percent/100*360);
  needleEl.setAttribute('x2', needleTip.x);
  needleEl.setAttribute('y2', needleTip.y);

  statPct.textContent = percent.toFixed(1) + '%';
  statTotal.textContent = hoursInMonth + 'h';
  statRemain.textContent = remH + 'h ' + pad(remM) + 'm';

  const dd = String(now.getDate()).padStart(2,'0');
  const mm = String(month+1).padStart(2,'0');
  calRef.textContent = `${dd}/${mm}/${year} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
